name: Trigger AI News Pipeline on Vercel

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # allows manual "Run workflow" from the Actions tab

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel endpoint
        run: |
          http_code=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${VERCEL_APP_URL}/api/run-pipeline" \
            -H "Authorization: Bearer ${RUN_SECRET}")
          echo "HTTP status: $http_code"
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            echo "Pipeline call failed"
            exit 1
          fi
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}   # e.g. https://ai-news-bot.vercel.app
          RUN_SECRET: ${{ secrets.RUN_SECRET }}